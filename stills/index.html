<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Digi Cam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* digi cam page: a still, draggable slide-mount ball centred on QuickSnap green; tapping a slide opens the carousel */
  :root {
    --quicksnap: #757d64;
    --ink: #fefae0;
    --ink-dim: rgba(254, 250, 224, .7);
    --control: rgba(255, 255, 255, .16);
    --control-hot: rgba(255, 255, 255, .3);
    --type: "IBM Plex Mono", "Courier New", Courier, monospace;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--quicksnap); overflow: hidden; font-family: var(--type); color: var(--ink); }
  #app { position: fixed; inset: 0; background: var(--quicksnap); }

  .view { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    transition: opacity .5s cubic-bezier(.4, 0, .2, 1), transform .5s cubic-bezier(.4, 0, .2, 1); }
  .view.hidden { opacity: 0; transform: scale(.88); pointer-events: none; }
  .view.visible { opacity: 1; transform: scale(1); }

  #ball-view { cursor: grab; touch-action: none; }
  #ball-view.over-tile { cursor: pointer; }
  #ball-view.dragging { cursor: grabbing; }
  #ball-view canvas { display: block; position: absolute; inset: 0; }

  .back { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 2;
    color: var(--ink); text-decoration: none; font-size: 14px; padding: 8px 10px; border-radius: 6px; }
  .back:hover { background: var(--control); }
  .hint { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; margin: 0;
    text-align: center; font-size: 13px; color: var(--ink-dim); letter-spacing: .04em; pointer-events: none; transition: opacity .6s; }
  .hint.gone { opacity: 0; }
  .loading { position: absolute; color: var(--ink-dim); font-size: 13px; }

  #carousel-view { flex-direction: column; padding: 0 16px; }
  #carousel-stage { --ar: 1.5; position: relative; width: min(84vw, 960px, calc(72vh * var(--ar))); aspect-ratio: var(--ar); touch-action: pan-y; }
  #carousel-photo { width: 100%; height: 100%; border-radius: 6px; overflow: hidden; user-select: none;
    box-shadow: 0 22px 60px rgba(0, 0, 0, .32), 0 4px 14px rgba(0, 0, 0, .22); }
  #carousel-photo { background: rgba(0, 0, 0, .18); }
  #carousel-photo > * { display: block; width: 100%; height: 100%; object-fit: cover; }
  #carousel-label { margin-top: 18px; color: var(--ink-dim); font-size: 13px; letter-spacing: .06em; text-align: center; font-variant-numeric: tabular-nums; }

  .round-btn { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--control); color: var(--ink);
    font: 24px/1 var(--type); display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .2s; }
  .round-btn:hover { background: var(--control-hot); }
  .round-btn:active { transform: scale(.95); }
  .round-btn:focus-visible, .back:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .nav { position: absolute; top: 50%; translate: 0 -50%; }
  #carousel-prev { left: -72px; }
  #carousel-next { right: -72px; }
  #carousel-close { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px; font-size: 22px; }

  @media (max-width: 760px) {
    #carousel-prev { left: 8px; }
    #carousel-next { right: 8px; }
    .round-btn { width: 44px; height: 44px; font-size: 20px; }
  }
  @media (prefers-reduced-motion: reduce) { .view, .hint { transition-duration: .01ms; } }

  html, body, #app { background-image: radial-gradient(rgba(254, 250, 224, .12) 1px, transparent 1.2px); background-size: 22px 22px; }

  :root { --edge: 44px; }

// Painted stand-ins that read like old 35mm slides: real-ish scenes (mountains, lakes, old towns,
// woods, sea, a portrait) with film grain, lifted blacks, faded colour casts and a vignette.
function makePlaceholders(n) {
  const out = [];
  const kinds = [0, 2, 1, 5, 3, 4, 0, 2, 1, 3, 4, 5];
  const skies = [ // [top, horizon, cloud]
    [[.30, .52, .78], [.80, .86, .90], [.97, .97, .96]],
    [[.42, .60, .80], [.92, .88, .80], [1, .97, .92]],
    [[.55, .45, .48], [.98, .76, .55], [1, .88, .78]],   // dusk
    [[.25, .45, .70], [.70, .80, .88], [.95, .96, .97]],
    [[.62, .70, .74], [.86, .88, .86], [.93, .93, .92]], // overcast
  ];
  const casts = [[1, 1, 1], [.9, 1.08, .94], [1.1, .92, .9], [1.04, 1, .86], [.94, 1.02, 1.08], [.88, 1.1, .96]];
  for (let i = 0; i < n; i++) {
    const r = (k) => { const x = Math.sin((i + 1) * k * 12.9898) * 43758.5453; return x - Math.floor(x); };
    out.push({ url: null, label: `photo ${String(i + 1).padStart(2, "0")}`, kind: kinds[i % kinds.length], seed: 1 + r(1) * 50,
      sky: skies[Math.floor(r(2) * skies.length)], cast: casts[Math.floor(r(3) * casts.length)],
      hz: .42 + r(4) * .2, exposure: .82 + r(5) * .4, fx: .3 + r(6) * .4, snow: r(7) < .5,
      hue: r(8), blur: r(9) < .25 });
  }

}

const hash = (x, y, s) => { const h = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return h - Math.floor(h); };

  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s, o = 5) { let t = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { t += a * vnoise(x * f, y * f, s + i * 13); f *= 2; a *= .5; } return t / (1 - Math.pow(.5, o)); }
const sst = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

function sceneColor(p, u, v, asp, B) {
  const x = u * asp, s = p.seed, [skT, skH, cld] = p.sky, hz = p.hz;
  const sky = (vv) => {
    let c = mix(skT, skH, Math.pow(Math.min(1, Math.max(0, vv / hz)), .8));
    const cl = sst(.52, .78, fbm(x * 2.2 + s, vv * 5.5, s + 3, 5));
    return mix(c, mix(cld, [cld[0] * .8, cld[1] * .8, cld[2] * .82], sst(.6, .9, fbm(x * 4, vv * 8, s + 9, 3))), cl * .85);
  };
  const tex = (k) => fbm(x * k, v * k, s + 21, 4);
  switch (p.kind) {
    case 0: case 1: { // mountains over a meadow (0) or a lake (1)
      const r1 = hz - .08 - .22 * fbm(x * 1.4 + s, 0, s + 5, 5), r2 = hz - .02 - .09 * fbm(x * 3 + s, 1, s + 7, 4);
      if (p.kind === 1 && v > hz) { // water mirrors what is above it
        const m = 2 * hz - v + .012 * (fbm(x * 3, v * 70, s + 11, 3) - .5);
        let c = sceneColor({ ...p, kind: 0 }, u, Math.max(0, m), asp, B);
        return mix(c, [.18, .26, .30], .35 + .25 * (v - hz) / (1 - hz));
      }
      if (v < r1) return sky(v);
      if (v < r2) { // far ridge, hazy, snow on the tops
        let c = mix([.36, .40, .46], skH, .45);
        c = mix(c, [.25, .28, .30], tex(9) * .5);
        const peak = sst(hz - .2, hz - .3, r1); if (p.snow && peak > 0 && v < r1 + .05 * peak + .02 * tex(14) * peak) c = mix(c, mix([.93, .94, .96], [.7, .74, .8], tex(30)), .9 * peak);
        return c;
      }
      if (v < hz) return mix([.20, .30, .18], [.12, .18, .12], tex(12));
      const g = tex(18), d = (v - hz) / (1 - hz);
      return mix(mix([.42, .52, .24], [.26, .36, .14], g), [.20, .24, .10], d * .6 + .2 * fbm(x * 40, v * 6, s, 2));
    }
    case 2: case 5: { // old town by day (2) or lit up at dusk over the water (5)
      const night = p.kind === 5;
      for (const b of B) if (u >= b.x0 && u < b.x1) {
        const top = hz - b.h;
        if (v < top - b.roof * (1 - Math.abs((u - b.x0) / (b.x1 - b.x0) * 2 - 1))) break;
        if (v < top) return mix(b.rc, [.15, .1, .08], tex(30) * .4);
        const cu = ((u - b.x0) / (b.x1 - b.x0)) * b.cols, cv = (v - top) / (b.h + .25) * b.rows;
        const win = Math.abs(cu - Math.floor(cu) - .5) < .2 && Math.abs(cv - Math.floor(cv) - .5) < .26 && v < hz + .2;
        let c = mix(b.c, [b.c[0] * .7, b.c[1] * .7, b.c[2] * .7], tex(25) * .6);
        if (night) c = mix([.07, .07, .1], [.12, .1, .12], tex(25));
        if (win) c = night ? (hash(Math.floor(cu) + b.x0 * 99, Math.floor(cv), p.seed) > .45 ? [1, .78, .42] : [.05, .05, .08]) : mix([.12, .12, .14], skH, .15);
        if (v > hz + .2) break;

      }
      if (v > hz + .2) {
        if (!night) return mix([.40, .38, .35], [.25, .24, .22], tex(40));
        const streak = sst(.7, .95, fbm(x * 1.5, v * 90, s + 4, 3)) * sst(.3, .7, fbm(x * 9, 0, s + 6, 3));
        return mix([.04, .06, .1], [1, .75, .4], streak * .8);
      }
      if (night) return mix([.10, .12, .28], [.75, .42, .35], Math.pow(v / hz, 2));
      return sky(v);
    }
    case 3: { // woods: dense leaves with bits of sky, a path
      const g = fbm(x * 5, v * 5, s + 2, 6);
      if (g > .66 && v < .45) return sky(v);
      const path = Math.abs(u - .5 - (1 - v) * .1) < .03 + (v - .55) * .35 && v > .55;
      if (path) return mix([.62, .55, .42], [.40, .34, .24], tex(30));
      return mix(mix([.10, .20, .08], [.42, .55, .20], sst(.35, .8, g)), [.6, .7, .3], sst(.75, .9, fbm(x * 18, v * 18, s, 3)) * .35);
    }
    case 4: { // sea and sand
      if (v < hz) return sky(v);
      if (v < hz + .22) {
        const d = (v - hz) / .22, sp = sst(.82, .95, fbm(x * 30, v * 120, s, 3));
        return mix(mix([.16, .32, .48], [.20, .45, .52], d), [1, 1, .95], sp * .7);
      }
      if (v < hz + .25) return mix([.92, .92, .88], [.7, .78, .76], tex(50));
      return mix([.80, .70, .52], [.62, .52, .38], tex(25));
    }
    default: return [.5, .5, .5];
  }
}

const photoCache = new Map();
function renderPhoto(p, W, H) {
  const key = p.label + W;
  if (photoCache.has(key)) return photoCache.get(key);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), id = g.createImageData(W, H), d = id.data, asp = W / H;
  const B = []; // buildings for the town scenes
  if (p.kind === 2 || p.kind === 5) {
    let x = -.05, k = 0; const pal = [[.82, .66, .45], [.74, .48, .36], [.88, .80, .64], [.66, .58, .50], [.80, .56, .40]];
    while (x < 1.05) { const w = .12 + hash(k, 1, p.seed) * .14; B.push({ x0: x, x1: x + w, h: .18 + hash(k, 2, p.seed) * .3, roof: hash(k, 3, p.seed) * .08,
      c: pal[Math.floor(hash(k, 4, p.seed) * pal.length)], rc: [.45, .22, .16], cols: 2 + Math.floor(hash(k, 5, p.seed) * 3), rows: 3 + Math.floor(hash(k, 6, p.seed) * 3) }); x += w; k++; }
  }
  const [cr, cg, cb] = p.cast, e = p.exposure;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const u = x / W, v = y / H;
    let [r, gg, b] = sceneColor(p, u, v, asp, B);
    const vig = 1 - .45 * Math.pow(Math.hypot((u - .5) * 1.1, v - .5) * 1.25, 2.2);
    const n = (Math.random() - .5) * .07;
    r = (r * cr * e * vig + n) * .9 + .06; gg = (gg * cg * e * vig + n) * .9 + .06; b = (b * cb * e * vig + n) * .9 + .07;
    const i = (y * W + x) * 4;
    d[i] = Math.min(255, Math.max(0, r * 255)); d[i + 1] = Math.min(255, Math.max(0, gg * 255)); d[i + 2] = Math.min(255, Math.max(0, b * 255)); d[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);

  const out = document.createElement("canvas"); out.width = W; out.height = H;
  const o = out.getContext("2d"); o.filter = `blur(${(p.blur ? 2.2 : .6) * W / 600}px)`; o.drawImage(c, 0, 0);
  photoCache.set(key, out);

}

function paintPhoto(g, photo, img, x, y, w, h) {
  if (img) {
    const ir = img.width / img.height, br = w / h; let sw, sh, sx, sy;
    if (ir > br) { sh = img.height; sw = sh * br; sx = (img.width - sw) / 2; sy = 0; } else { sw = img.width; sh = sw / br; sx = 0; sy = (img.height - sh) / 2; }
    g.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  } else g.drawImage(renderPhoto(photo, 168, 112), x, y, w, h);
}

// mount styles seen on the reference ball: cream "orient color" plastic, white card, black plastic, grey plastic, orange and red card.
// glow = how much bulb light comes through the mount itself
const MOUNTS = [
  { w: .30, body: ["#f3efe2", "#d9d3c0"], top: "ORIENT COLOR", bottom: "Kodak PROCESS", ink: "#3b3a36", logo: true, glow: .2 },
  { w: .20, body: ["#fbfaf5", "#e4e0d4"], top: "", bottom: "Kodachrome", ink: "#c2412d", hand: true, glow: .24 },
  { w: .20, body: ["#2b2a28", "#151514"], top: "", bottom: "", ink: "#d8d4c8", black: true, glow: 0 },
  { w: .14, body: ["#d9d8d3", "#b5b4ae"], top: "AGFACOLOR", bottom: "", ink: "#4a4a46", glow: .14 },
  { w: .09, body: ["#e3a248", "#c47a26"], top: "Kodachrome", bottom: "", ink: "#4a2a10", glow: .12 },
  { w: .07, body: ["#c8392b", "#9a281e"], top: "PROCESS", bottom: "", ink: "#f6e9de", glow: .1 },

function pickMount(r) { let a = 0; for (let i = 0; i < MOUNTS.length; i++) { a += MOUNTS[i].w; if (r < a) return i; } return 0; }

const MOUNT = 256, PAD = 36, TEX = MOUNT + PAD * 2;   // texture = mount + room for its soft shadow

  const wx = (S - ww) / 2, wy = (S - wh) / 2 + (m.top && !m.bottom ? S * .04 : 0);

  g.fillStyle = "rgba(0,0,0,.85)"; rr(g, wx - S * .008, wy - S * .008, ww + S * .016, wh + S * .016, wr); g.fill();

    g.fillText(m.bottom, S / 2, wy + wh + (S - wy - wh) / 2 + S * .005, S * .8);
  }

  if (m.hand) {

const ballView = document.getElementById("ball-view");
const scene = new THREE.Scene();
scene.background = null;
const camera = new THREE.PerspectiveCamera(FOV, 1, .1, 100);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x757d64, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
ballView.prepend(renderer.domElement);

scene.add(new THREE.AmbientLight(0xfff4e2, .75));
const key = new THREE.DirectionalLight(0xfff0d8, .7); key.position.set(2, 4, 6); scene.add(key);

const ball = new THREE.Group(); scene.add(ball);
ball.rotation.set(.18, -.4, 0);
// the bulb inside: warm light leaking through the gaps between slides
const core = new THREE.Mesh(new THREE.SphereGeometry(R * .955, 48, 32), new THREE.MeshBasicMaterial({ color: 0xf2cf8e }));
core.renderOrder = -1e6;
ball.add(core);

// bloom is a nice-to-have: if the add-on modules fail to load, render without it
let composer = null, bloom = null;
try {
  const [{ EffectComposer }, { RenderPass }, { UnrealBloomPass }, { OutputPass }] = await Promise.all([
    import("three/addons/postprocessing/EffectComposer.js"), import("three/addons/postprocessing/RenderPass.js"),
    import("three/addons/postprocessing/UnrealBloomPass.js"), import("three/addons/postprocessing/OutputPass.js")]);
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene, camera));
  bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), .55, .6, .8);
  composer.addPass(bloom);
  composer.addPass(new OutputPass());
} catch (err) { composer = null; }

function size() {
  const w = Math.max(1, innerWidth), h = Math.max(1, innerHeight), t = Math.tan(FOV * Math.PI / 360);
  camera.aspect = w / h;
  camera.position.set(0, 0, R * h / (t * (w < h ? .86 : BALL_FRACTION) * Math.min(w, h)) + 0);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  if (composer) composer.setSize(w, h);
  dirty = true;
}

const tiles = [];
const loadImg = (url) => new Promise((ok) => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => ok(i); i.onerror = () => ok(null); i.src = url; });

async function buildTiles() {
  const imgs = await Promise.all(PHOTOS.map((p) => (p.tile || p.url) ? loadImg(p.tile || p.url) : null));
  const geo = new THREE.PlaneGeometry(1, 1);
  const cache = new Map();
  const golden = Math.PI * (3 - Math.sqrt(5));
  const spacing = Math.sqrt(4 * Math.PI * R * R / TILE_COUNT);
  const rnd = (k) => { const x = Math.sin(k * 78.233 + 1.7) * 43758.5453; return x - Math.floor(x); };
  for (let i = 0; i < TILE_COUNT; i++) {
    // Fibonacci sphere: even spacing, no crowding at the poles
    const y = 1 - (2 * (i + .5)) / TILE_COUNT, rad = Math.sqrt(1 - y * y), th = golden * i;
    const n = new THREE.Vector3(Math.cos(th) * rad, y, Math.sin(th) * rad);
    const photoIndex = (i * 11) % PHOTOS.length, m = pickMount(rnd(i * 3 + 1));
    const keyId = photoIndex + ":" + m;
    let tex = cache.get(keyId);
    if (!tex) {
      const c = mountTextures(PHOTOS[photoIndex], imgs[photoIndex], MOUNTS[m], rnd(i * 5 + 2));
      const map = new THREE.CanvasTexture(c.map), em = new THREE.CanvasTexture(c.em);
      map.colorSpace = em.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = em.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex = { map, em }; cache.set(keyId, tex);
    }
    const mat = new THREE.MeshStandardMaterial({ map: tex.map, emissiveMap: tex.em, emissive: 0xffffff, emissiveIntensity: .5, roughness: .6, metalness: 0, transparent: true, alphaTest: .01, depthWrite: false });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(n).multiplyScalar(R * (1 + (rnd(i * 7 + 3) - .5) * .025));
    mesh.lookAt(n.clone().multiplyScalar(R * 2));          // face outward, rows roughly level like a hand-glued ball
    if (rnd(i * 11 + 4) < .18) mesh.rotateZ(Math.PI / 2);  // the odd portrait slide
    mesh.rotateZ((rnd(i * 13 + 5) - .5) * .16);            // handmade wobble
    mesh.rotateX((rnd(i * 23 + 8) - .5) * .14); mesh.rotateY((rnd(i * 29 + 9) - .5) * .14);  // glued on slightly unevenly
    mesh.scale.setScalar(spacing * (1.05 + rnd(i * 17 + 6) * .08) * TEX / MOUNT);
    mesh.userData = { photoIndex, normal: n.clone(), glow: .8 + rnd(i * 19 + 7) * .45 };
    ball.add(mesh); tiles.push(mesh);
  }
}

/* ======================== drag, inertia, tap ======================== */
let dirty = true, dragging = false, last = { x: 0, y: 0 }, down = { x: 0, y: 0, t: 0 }, vel = { x: 0, y: 0 }, carouselOpen = false;
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
const hint = ballView.querySelector(".hint");

function spin(dx, dy) {
  const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(dy * DRAG, dx * DRAG, 0, "XYZ"));
  ball.quaternion.premultiply(q); dirty = true;
}
function tileAt(x, y) {
  ndc.set((x / innerWidth) * 2 - 1, -(y / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(tiles, false)[0];
  if (hit) return hit.object;
  // tapped a gap: take the slide nearest to that spot
  const c = ray.intersectObject(core, false)[0];
  if (!c) return null;
  const local = ball.worldToLocal(c.point.clone()).normalize();
  let best = null, bd = -2;
  for (const t of tiles) { const d = t.userData.normal.dot(local); if (d > bd) { bd = d; best = t; } }
  return best;
}

ballView.addEventListener("pointerdown", (e) => {
  if (carouselOpen || e.target.closest("a, button")) return;
  dragging = true; vel = { x: 0, y: 0 };
  last = { x: e.clientX, y: e.clientY }; down = { x: e.clientX, y: e.clientY, t: performance.now() };
  ballView.setPointerCapture(e.pointerId); ballView.classList.add("dragging");
});
ballView.addEventListener("pointermove", (e) => {
  if (!dragging) {
    if (e.pointerType === "mouse" && !carouselOpen) ballView.classList.toggle("over-tile", !!tileAt(e.clientX, e.clientY));
    return;
  }
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  spin(dx, dy); vel = { x: dx, y: dy }; last = { x: e.clientX, y: e.clientY };
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 20) hint.classList.add("gone");
});
function endDrag(e) {
  if (!dragging) return;
  dragging = false; ballView.classList.remove("dragging");
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (moved < TAP_DIST && performance.now() - down.t < TAP_MS) {
    vel = { x: 0, y: 0 };
    const t = tileAt(e.clientX, e.clientY);
    if (t) openCarousel(t.userData.photoIndex);
  } else if (reduceMotion) vel = { x: 0, y: 0 };
}
ballView.addEventListener("pointerup", endDrag);
ballView.addEventListener("pointercancel", endDrag);

// keyboard: arrows turn the ball, enter opens the photo facing you
ballView.tabIndex = 0;
ballView.setAttribute("aria-label", "Photo disco ball. Arrow keys turn it, Enter opens the photo in front.");
ballView.addEventListener("keydown", (e) => {
  if (carouselOpen) return;
  const k = { ArrowLeft: [-30, 0], ArrowRight: [30, 0], ArrowUp: [0, -30], ArrowDown: [0, 30] }[e.key];
  if (k) { spin(...k); e.preventDefault(); }
  if (e.key === "Enter" || e.key === " ") { const t = tileAt(innerWidth / 2, innerHeight / 2); if (t) openCarousel(t.userData.photoIndex); e.preventDefault(); }
});

/* ============================ carousel ============================ */
const carouselView = document.getElementById("carousel-view"), photoEl = document.getElementById("carousel-photo"),
  labelEl = document.getElementById("carousel-label"), closeBtn = document.getElementById("carousel-close"), stage = document.getElementById("carousel-stage");
let idx = 0;
function renderSlide() {
  const p = PHOTOS[idx]; photoEl.replaceChildren();
  stage.style.setProperty("--ar", p.ar || 1.5);
  if (p.url) {
    const im = new Image(); im.src = p.url; im.alt = p.label || `photo ${idx + 1} of ${PHOTOS.length}`; im.draggable = false; photoEl.append(im);
    [1, -1].forEach((d) => { const q = PHOTOS[(idx + d + PHOTOS.length) % PHOTOS.length]; if (q.url) new Image().src = q.url; });  // next and previous load ahead
  }
  else { const c = renderPhoto(p, 780, 520); c.setAttribute("role", "img"); c.setAttribute("aria-label", p.label); photoEl.append(c); }
  labelEl.textContent = `${p.label ? p.label + " · " : ""}${idx + 1} / ${PHOTOS.length}`;
}
function openCarousel(i) {
  idx = i; renderSlide(); carouselOpen = true; vel = { x: 0, y: 0 };
  ballView.classList.replace("visible", "hidden"); carouselView.classList.replace("hidden", "visible");
  carouselView.setAttribute("aria-hidden", "false"); closeBtn.focus();
}
function closeCarousel() {
  carouselOpen = false;
  carouselView.classList.replace("visible", "hidden"); ballView.classList.replace("hidden", "visible");
  carouselView.setAttribute("aria-hidden", "true"); ballView.focus({ preventScroll: true }); dirty = true;
}
const go = (d) => { idx = (idx + d + PHOTOS.length) % PHOTOS.length; renderSlide(); };
closeBtn.addEventListener("click", closeCarousel);
document.getElementById("carousel-prev").addEventListener("click", () => go(-1));
document.getElementById("carousel-next").addEventListener("click", () => go(1));
carouselView.addEventListener("click", (e) => { if (e.target === carouselView) closeCarousel(); });
document.addEventListener("keydown", (e) => {
  if (!carouselOpen) return;
  if (e.key === "Escape") closeCarousel();
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
let swipeX = null;
stage.addEventListener("pointerdown", (e) => { if (!e.target.closest("button")) swipeX = e.clientX; });
stage.addEventListener("pointerup", (e) => { if (swipeX === null) return; const dx = e.clientX - swipeX; swipeX = null; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); });

/* ============================ loop ============================ */
const tmp = new THREE.Vector3();
function frame() {
  requestAnimationFrame(frame);
  if (!dragging && !carouselOpen && Math.hypot(vel.x, vel.y) > .05) { spin(vel.x, vel.y); vel.x *= FRICTION; vel.y *= FRICTION; }
  if (!dirty) return;      // the ball is still unless you move it, so only draw when something changed
  dirty = false;
  for (const t of tiles) {
    tmp.copy(t.userData.normal).applyQuaternion(ball.quaternion);
    const f = Math.max(0, tmp.dot(HOTSPOT));
    t.material.emissiveIntensity = (.55 + Math.pow(f, 4) * 1.3) * t.userData.glow * (.45 + .55 * Math.min(1, Math.max(0, tmp.z) * 1.6));
    t.renderOrder = tmp.z * 1000;  // overlapping slides stack nearest-on-top, like glued paper, instead of slicing through each other
  }
  composer ? composer.render() : renderer.render(scene, camera);
}

addEventListener("resize", size);
size();
await buildTiles();
ballView.querySelector(".loading").remove();
dirty = true;
frame();
</script>
